services:

  # Nginx service
  nginx:
    image: nginx:alpine
    container_name: php-nginx
    ports:
      - 80:80
    volumes:
      - ./www:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - php
    networks:
      mynetwork:

  # PHP service
  php:
#    tty: true # Enables debugging capabilities when attached to this container.
    build: docker/php80
#    ports:
#      - 9000:9000
    container_name: php-app
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./www:/var/www
      - ./tmp/grinds:/tmp/grinds
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: mydatabase
      DB_USERNAME: bitrix
      DB_PASSWORD: "+Tr+()8]!szl[HQIsoT5"
      XDEBUG_CONFIG: client_host=${MYIP:-host.docker.internal}
      DEBUG: 1
#      PHP_IDE_CONFIG: serverName=localhost
    working_dir: /var/www
    networks:
      mynetwork:

  # MySQL database service
  mysql:
    image: 'mariadb:11.4'
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 20s
      retries: 10
    ports:
      - "3306:3306"
    volumes:
      - ./database:/var/lib/mysql
      - ./logs/mysql:/var/log/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
    environment:
      MYSQL_ROOT_PASSWORD: "+Tr+()8]!szl[HQIsoT5"
      MYSQL_DATABASE: mydatabase
      MYSQL_USER: bitrix
      MYSQL_PASSWORD: "+Tr+()8]!szl[HQIsoT5"
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci', '--skip-character-set-client-handshake', '--sql-mode=']
    networks:
      mynetwork:
        aliases:
          - mysql

  # MySQL database service
  phpmyadmin:
    image: phpmyadmin:5.2-apache
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - 8181:80
    environment:
      PMA_HOST: mysql
      PMA_USER: bitrix
      PMA_PASSWORD: "+Tr+()8]!szl[HQIsoT5"
    networks:
      mynetwork:
        aliases:
          - mysql


networks:
  mynetwork:
    driver: bridge
